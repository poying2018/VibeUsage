name = "github-accelerator-worker"
main = "index.js"
compatibility_date = "2025-11-11"

# 自定义域名（更新检查 / 下载加速入口，App 内置该域名）
routes = [
  { pattern = "github.20050912.xyz", custom_domain = true }
]

# KV 全局限流
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "9720f6e666bf43608d7ed849cd17d2a0"

# AUTH_TOKEN(网页工具访问密码)与 APP_KEY(app 内置密钥)通过 wrangler secret 配置
